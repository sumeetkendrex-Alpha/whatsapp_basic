<template>
    <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container" style="width:100%; max-width: 55rem;">

            <!-- Modal Header -->
            <header class="slds-modal__header">
                <h2 class="slds-modal__title slds-hyphenate">WhatsApp Template</h2>
            </header>

            <!-- Modal Body -->
            <div class="slds-modal__content slds-p-around_medium" style="height: 500px; overflow-y: auto;">
                <template if:true={isStepA}>
                    <c-whatsapp-template-selector form-data={formData} oninputchange={handleInputChange}>
                    </c-whatsapp-template-selector>
                </template>

                <template if:true={isStepB}>
                    <c-whatsapp-template-builder form-data={formData} oninputchange={handleInputChange}>
                    </c-whatsapp-template-builder>
                </template>
            </div>

            <!-- Modal Footer with Centered Buttons -->
            <footer class="slds-modal__footer">
                <div class="slds-grid slds-grid_align-center">
                    <lightning-button label= "Cancel" onclick={handleCancel} class="slds-m-right_small">
                    </lightning-button>
                    <lightning-button label="Previous" onclick={handlePrevious} disabled={isStepA}>
                    </lightning-button>
                    <template if:true={isStepA}>
                        <lightning-button label={nextButtonLabel} onclick={handleNext} class="slds-m-left_small">
                        </lightning-button>
                    </template>
                    <template if:true={isStepB}>
                        <lightning-button label="Save" onclick={handleSave} class="slds-m-left_small">
                        </lightning-button>
                    </template>
                </div>
            </footer>
        </div>
    </section>

    <!-- Backdrop -->
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
