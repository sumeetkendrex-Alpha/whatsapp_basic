<template>
  <!-- Message Analisis start here -->
  <div class="message-analysis" style="background-color: white;">
    <h1 style="margin-bottom:10px;font-size: large;">Message Analysis</h1>

    <div class="messsage-analysis-sub1">
      <div class="sub1-box">
        <div class="icon-cls">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
            class="bi bi-chat-left-text" viewBox="0 0 16 16">
            <path
              d="M14 1a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H4.414A2 2 0 0 0 3 11.586l-2 2V2a1 1 0 0 1 1-1zM2 0a2 2 0 0 0-2 2v12.793a.5.5 0 0 0 .854.353l2.853-2.853A1 1 0 0 1 4.414 12H14a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2z" />
            <path
              d="M3 3.5a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 0 1h-9a.5.5 0 0 1-.5-.5M3 6a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 0 1h-9A.5.5 0 0 1 3 6m0 2.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5" />
          </svg>
        </div>
        <div class="count">{messageTotal}</div>
        <div>All Messages</div>
      </div>
      <div class="sub1-box">
        <div class="icon-cls">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
            class="bi bi-collection-play" viewBox="0 0 16 16">
            <path
              d="M2 3a.5.5 0 0 0 .5.5h11a.5.5 0 0 0 0-1h-11A.5.5 0 0 0 2 3m2-2a.5.5 0 0 0 .5.5h7a.5.5 0 0 0 0-1h-7A.5.5 0 0 0 4 1m2.765 5.576A.5.5 0 0 0 6 7v5a.5.5 0 0 0 .765.424l4-2.5a.5.5 0 0 0 0-.848z" />
            <path
              d="M1.5 14.5A1.5 1.5 0 0 1 0 13V6a1.5 1.5 0 0 1 1.5-1.5h13A1.5 1.5 0 0 1 16 6v7a1.5 1.5 0 0 1-1.5 1.5zm13-1a.5.5 0 0 0 .5-.5V6a.5.5 0 0 0-.5-.5h-13A.5.5 0 0 0 1 6v7a.5.5 0 0 0 .5.5z" />
          </svg>
        </div>
        <div class="count">{mediaCount}</div>
        <div>Media Messages</div>
      </div>
      <div class="sub1-box">
        <div class="icon-cls">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
            class="bi bi-chat-square-text" viewBox="0 0 16 16">
            <path
              d="M14 1a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1h-2.5a2 2 0 0 0-1.6.8L8 14.333 6.1 11.8a2 2 0 0 0-1.6-.8H2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1zM2 0a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2.5a1 1 0 0 1 .8.4l1.9 2.533a1 1 0 0 0 1.6 0l1.9-2.533a1 1 0 0 1 .8-.4H14a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2z" />
            <path
              d="M3 3.5a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 0 1h-9a.5.5 0 0 1-.5-.5M3 6a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 0 1h-9A.5.5 0 0 1 3 6m0 2.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5" />
          </svg>
        </div>
        <div class="count">{textCount}</div>
        <div>Text Messages</div>
      </div>
      <div class="sub1-box">
        <div class="icon-cls">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
            class="bi bi-calendar4-event" viewBox="0 0 16 16">
            <path
              d="M3.5 0a.5.5 0 0 1 .5.5V1h8V.5a.5.5 0 0 1 1 0V1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h1V.5a.5.5 0 0 1 .5-.5M2 2a1 1 0 0 0-1 1v1h14V3a1 1 0 0 0-1-1zm13 3H1v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1z" />
            <path d="M11 7.5a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5z" />
          </svg>
        </div>
        <div class="count">{totalMessaegesPerday}</div>
        <div>Messages per day</div>
      </div>
      <div class="sub1-box">
        <div class="icon-cls">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-calendar3"
            viewBox="0 0 16 16">
            <path
              d="M14 0H2a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2M1 3.857C1 3.384 1.448 3 2 3h12c.552 0 1 .384 1 .857v10.286c0 .473-.448.857-1 .857H2c-.552 0-1-.384-1-.857z" />
            <path
              d="M6.5 7a1 1 0 1 0 0-2 1 1 0 0 0 0 2m3 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2m3 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2m-9 3a1 1 0 1 0 0-2 1 1 0 0 0 0 2m3 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2m3 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2m3 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2m-9 3a1 1 0 1 0 0-2 1 1 0 0 0 0 2m3 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2m3 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2" />
          </svg>
        </div>

        <div class="count">{daysDifference}</div>
        <div>No of days</div>
      </div>
      <div class="sub1-box">
        <div class="icon-cls">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-calendar-plus"
            viewBox="0 0 16 16">
            <path
              d="M8 7a.5.5 0 0 1 .5.5V9H10a.5.5 0 0 1 0 1H8.5v1.5a.5.5 0 0 1-1 0V10H6a.5.5 0 0 1 0-1h1.5V7.5A.5.5 0 0 1 8 7" />
            <path
              d="M3.5 0a.5.5 0 0 1 .5.5V1h8V.5a.5.5 0 0 1 1 0V1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h1V.5a.5.5 0 0 1 .5-.5M1 4v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V4z" />
          </svg>
        </div>
        <lightning-input type="date" name="startDate" label="StartDate" value={selectedStartDate}
          onchange={handleStartDateChange}> </lightning-input>
      </div>
      <div class="sub1-box">
        <div class="icon-cls">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
            class="bi bi-calendar-minus" viewBox="0 0 16 16">
            <path d="M5.5 9.5A.5.5 0 0 1 6 9h4a.5.5 0 0 1 0 1H6a.5.5 0 0 1-.5-.5" />
            <path
              d="M3.5 0a.5.5 0 0 1 .5.5V1h8V.5a.5.5 0 0 1 1 0V1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h1V.5a.5.5 0 0 1 .5-.5M1 4v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V4z" />
          </svg>
        </div>
        <lightning-input type="date" name="EndDate" label="EndDate" value={selecteEndDate}
          onchange={handleEndDateChange}> </lightning-input>
      </div>
    </div>

    <div class="messsage-analysis-sub2">
      <div class="sub2-box-1">
        <div class="slds-p-around_medium">
          <div style="max-height: 360px; overflow: auto;">
            <table class="slds-table slds-table_cell-buffer slds-table_bordered">
              <thead>
                <tr class="slds-line-height_reset sticky-header">
                  <th scope="col">Sr No</th>
                  <th scope="col">Name</th>
                  <th scope="col">Sent Messages</th>
                  <th scope="col">Read Messages</th>
                  <th scope="col">Not Delivered</th>
                </tr>
              </thead>
              <tbody>
                <template for:each={tableData} for:item="item" for:index="index">
                  <tr key={item.id}>
                    <td>{item.index}</td>
                    <td>{item.name}</td>
                    <td>{item.sent}</td>
                    <td>{item.readMessages}</td>
                    <td>{item.notDelivered}</td>

                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="sub2-box-2">
        <template if:true={refreshData}>
          <c-chart chart={chartData}></c-chart>
        </template>
      </div>
    </div>
  </div>


  <!-- Template Analysis div start here -->
  <div class="template-analysis" style="background-color: white;">
    <h1 style="margin-bottom:10px;font-size: large;">Template Analysis</h1>

    <div class="template-analysis-sub1">
      <div class="sub3-box-1">
        <div class="slds-p-around_medium">
          <div style="max-height: 360px; overflow: auto;">
            <table class="slds-table slds-table_cell-buffer slds-table_bordered">
              <thead>
                <tr class="slds-line-height_reset sticky-header">
                  <th scope="col">Sr No</th>
                  <th scope="col">Template Name</th>
                  <th scope="col">Sent</th>
                  <th scope="col">Not Delivered</th>
                </tr>
              </thead>
              <tbody>
                <template for:each={templatetableData} for:item="item" for:index="index">
                  <tr key={item.id}>
                    <td>{item.index}</td>
                    <td>{item.Templatename}</td>
                    <td>{item.Countsent}</td>
                    <td>{item.countnotDelivered}</td>
                    <td>
                      <button class="viewInsigntButton" data-templatename={item.Templatename} onclick={handleViewInsights}>📊View Insignts</button>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </div>


      <div class="sub3-box-2">
        <div class="card">
          <div class="row header">
            <div class="line purple"></div>
            <div class="label bold">All conversations</div>
            <lightning-icon icon-name="utility:info" size="xx-small" class="info-icon"></lightning-icon>
            <div class="count bold">{allConversationCount}</div>
          </div>

          <div class="row">
            <div class="line cyan"></div>
            <div class="label">Marketing</div>
            <div class="count">{marketingCount}</div>
          </div>

          <div class="row">
            <div class="line pink"></div>
            <div class="label">Utility</div>
            <div class="count">{utilityCount}</div>
          </div>

          <div class="row">
            <div class="line orange"></div>
            <div class="label">Authentication</div>
            <div class="count">{authenticationCount}</div>
          </div>


          <div class="row">
            <div class="line green"></div>
            <div class="label">Service</div>
            <div class="count">{serviceCount}</div>
          </div>
        </div>
      </div>
    </div>
  </div>

</template>
