<template>
    <lightning-card >
        <div class="slds-p-around_medium">
            <h2 class="slds-text-heading_medium slds-m-bottom_small">
               Template Name: {templateName}
            </h2>
            <p class="slds-text-body_regular slds-m-bottom_medium">
                You are about to send this template to &nbsp;
                <strong>{users.length}</strong> users.
            </p>

            <template if:true={isLoading}>
                <lightning-spinner size="small" alternative-text="Sending messages"></lightning-spinner>
                <div class="slds-m-top_medium">
                    <lightning-progress-bar value={progressValue} size="medium"></lightning-progress-bar>
                    <p class="slds-text-title_bold slds-m-top_small">
                        Sending {processedCount} of {users.length} messages...
                    </p>
                </div>
            </template>

            <template if:false={isLoading}>
                <lightning-button variant="brand" label="Send Template" icon-name="utility:send" class="slds-m-top_medium" onclick={sendMessages}> </lightning-button>
            </template>
        </div>
    </lightning-card>
</template>
