<template>
    <div class="dashboard-container slds-p-around_medium">
        <!-- Header -->
        <div class="header slds-m-bottom_medium">

            <h1 class="slds-text-heading_medium">Template Insights</h1>
            <div class="date-range slds-p-around_x-small">
                <div class="dashboard-header">
                    <div class="metric-card slds-p-around_medium slds-m-left_large">
                        <div class="filter-title slds-m-bottom_medium">Select Date</div>

                        <div class="date-fields">
                            <div class="date-field">
                                <label for="start-date">Start Date</label>
                                <input type="date" id="start-date" name="start-date" onchange={handleStartDate}>
                            </div>

                            <!-- <div class="divider">to</div> -->

                            <div class="date-field">
                                <label for="end-date">End Date</label>
                                <input type="date" id="end-date" name="end-date" onchange={handleEndDate}>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Top Metrics -->
        <div class="metrics-row slds-grid slds-wrap slds-gutters">
            <div class="slds-col slds-size_1-of-3">
                <div class="metric-card slds-p-around_medium">
                    <div class="metric-label"><b>Amount spent</b></div>
                    <div class="metric-value">₹{summaryData.AmountSpent__c}</div>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-3">
                <div class="metric-card slds-p-around_medium">
                    <div class="metric-label"><b>Cost per message delivered</b></div>
                    <div class="metric-value">₹{summaryData.CostPerDelivered__c}</div>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-3">
                <div class="metric-card slds-p-around_medium">
                    <div class="metric-label"><b>Cost per website button click</b></div>
                    <div class="metric-value">₹{summaryData.CostPerUrlButtonClick__c}</div>
                </div>
            </div>
        </div>

        <!-- Performance Section -->
        <div class="performance-section slds-p-around_medium slds-m-top_medium">
            <div class="section-header slds-grid slds-wrap slds-grid_align-spread">
                <h2 class="slds-text-heading_small"><b>Performance</b></h2>
                <!-- <div class="performance-tabs slds-button-group">
                   
                </div> -->
            </div>

            <div class="performance-content slds-m-top_medium">
                <!-- Funnel Metrics -->
                <div class="funnel-metrics slds-grid slds-wrap slds-grid_align-space">
                    <div class="metric-item slds-text-align_center">
                        <div class="metric-title">Messages sent</div>
                        <div class="metric-value large">{summaryData.Sent__c}</div>
                    </div>
                    <div class="metric-item slds-text-align_center">
                        <div class="metric-title">Messages delivered</div>
                        <div class="metric-value large">{summaryData.Delivered__c}</div>
                    </div>
                    <div class="metric-item slds-text-align_center">
                        <div class="metric-title">Messages read</div>
                        <div class="metric-value large">{summaryData.Read__c} </div>
                    </div>
                    <div class="metric-item slds-text-align_center">
                        <div class="metric-title">Replies</div>
                        <div class="metric-value large">0</div>
                    </div>
                </div>

                <!-- Charts Container -->
                <div class="charts-container slds-grid slds-wrap slds-gutters slds-m-top_medium">

                    <!-- Trend Chart -->
                    <div class="slds-col slds-size_2-of-2">
                        <div class="chart-card slds-p-around_medium">
                            <div class="bar-chart" style="min-height: 350px;">
                                <template if:true={showBarSpinner}>
                                    <lightning-spinner alternative-text="Loading Bar Chart" size="medium">
                                    </lightning-spinner>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>
